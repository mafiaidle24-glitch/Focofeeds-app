<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foco</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fff;--surface:#f3f4f8;--ink:#171a24;--mute:#6b7080;--line:#e4e6ee;--accent:#4b3fe0;--on-accent:#fff;--like:#e5365c;--repost:#10b981;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--surface:#1c1f29;--ink:#eef0f6;--mute:#9aa0b2;--line:#2a2e3a;--accent:#8d84ff;--on-accent:#12141b;--like:#ff5c7f;--repost:#34d399;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:480px;margin:0 auto;padding-bottom:84px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;z-index:5;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0}

.stories{display:flex;gap:12px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;cursor:pointer;font-size:12px}
.story-ring{width:60px;height:60px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.story-ring.add{background:var(--line)}
.story-plus{position:absolute;right:2px;top:40px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--bg);line-height:1}
.story-del{font-size:15px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);border-radius:8px;padding:6px 12px}
.story-ring .av{width:100%;height:100%;border:2px solid var(--bg)}
.story-modal{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff}
.story-modal img,.story-modal video{max-width:100%;max-height:80vh;object-fit:contain}
.story-top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:52}

.post{border-bottom:1px solid var(--line);padding-bottom:12px}
.repost-tag{padding:8px 16px 0;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;font-weight:600}
.who{display:flex;align-items:center;gap:10px;padding:12px 16px}
.who .grow{flex:1}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.who small{color:var(--mute);display:block;line-height:1.2}
.follow-btn{font-size:13px;font-weight:700;color:var(--accent);padding:4px 10px;border-radius:6px;background:var(--surface)}
.follow-btn.following{color:var(--mute);background:transparent;border:1px solid var(--line)}
.post-media{width:100%;max-height:520px;object-fit:cover;display:block;background:#000}
.text-only{padding:8px 16px 12px;font-size:17px;white-space:pre-wrap}
.acts{display:flex;gap:18px;padding:10px 16px 4px;align-items:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ic{font-size:24px;line-height:1;padding:4px;display:flex;align-items:center;gap:4px}
.ic span{font-size:14px;font-weight:600}
.ic.on{color:var(--like)}
.ic.rep-on{color:var(--repost)}
.p{padding:0 16px;margin:4px 0}
.mute{color:var(--mute)}
.cm{display:flex;gap:8px;padding:8px 16px 0}
.cm input{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit;min-width:0}
.cm button{color:var(--accent);font-weight:700}

.empty{text-align:center;padding:64px 24px;color:var(--mute)}
.btn{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:12px 18px;font-weight:700;width:100%;text-align:center}
.btn.alt{background:var(--surface);color:var(--ink)}
.btn:disabled{opacity:.6}
.form{padding:16px;display:grid;gap:12px}
.form textarea,.form input:not([type=file]){width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.prev{width:100%;max-height:320px;object-fit:cover;border-radius:12px}
.drop{display:grid;place-items:center;min-height:140px;border:2px dashed var(--line);border-radius:12px;color:var(--mute);cursor:pointer;text-align:center;padding:16px}
.drop.has{border:0;padding:0}

.prof{padding:20px 16px;display:flex;gap:16px;align-items:center}
.prof .av{width:72px;height:72px;font-size:28px}
.stats{display:flex;gap:20px;padding:0 16px 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px;color:var(--mute);font-weight:700}
.tabs button.on{color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.msg{color:var(--like);margin:0;font-size:14px}
.msg.ok{color:var(--accent)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;padding:12px 0 10px;font-size:12px;color:var(--mute);display:grid;justify-items:center;gap:2px}
nav button span{font-size:24px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header><h1 class="logo">Foco</h1></header>
  <main id="main"><div class="empty">Carregando…</div></main>
</div>
<div id="story-overlay"></div>
<input id="story-file" type="file" accept="image/*,video/*" hidden>

<nav style="display:none"><div>
  <button data-v="feed" aria-label="Início"><span>⌂</span>Início</button>
  <button data-v="new" aria-label="Nova publicação"><span>＋</span>Publicar</button>
  <button data-v="prof" aria-label="Perfil"><span>☺</span>Perfil</button>
</div></nav>

<script>
var sb=supabase.createClient("https://zizvfbospppvwlldzwjz.supabase.co","sb_publishable_IkHRvoT4SwkJw2lZNQEU2A_z6ukZ0bM");
var me=null,P=null,posts=[],stories=[],following=[],view="feed",mode="in",msg="",ok=false,mediaBlob=null,mediaUrl=null,mediaType="image",busy=false;
var $=document.getElementById("main");

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ini(n){return esc((n||"?").trim().charAt(0).toUpperCase())}
function av(n,u){return '<div class="av">'+(u?'<img src="'+esc(u)+'" alt="">':ini(n))+'</div>'}
function ago(t){var m=Math.floor((Date.now()-new Date(t).getTime())/60000);if(m<1)return"agora";if(m<60)return m+" min";var h=Math.floor(m/60);if(h<24)return h+" h";return Math.floor(h/24)+" d"}
function val(id){var e=document.getElementById(id);return e?e.value.trim():""}
function tr(m){m=String(m||"");
  if(/Invalid login/i.test(m))return"E-mail ou senha incorretos.";
  if(/already registered/i.test(m))return"Este e-mail já tem conta. Toque em Entrar.";
  if(/at least 6/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  if(/rate limit/i.test(m))return"Muitas tentativas. Tente de novo em alguns minutos.";
  if(/not confirmed/i.test(m))return"Confirme seu e-mail antes de entrar.";
  if(/valid email|invalid/i.test(m))return"Digite um e-mail válido.";
  return"Algo deu errado. Tente de novo."}

async function setSession(s){
  me=s?s.user:null;P=null;posts=[];stories=[];following=[];
  if(me){
    var r=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
    P=r.data||{id:me.id,name:"Novo usuário",bio:"",avatar:null};
    await load();
  }
  render();
}

var loadErr="";
async function load(){
  loadErr="";
  var r=await sb.from("posts").select("id,image,media_type,caption,created_at,user_id,repost_of,profiles!posts_user_id_fkey(name,avatar),likes(user_id),comments(id,body,profiles!comments_user_id_fkey(name))").order("created_at",{ascending:false}).limit(60);
  if(r.error){
    loadErr="Posts: "+r.error.message;
    posts=await loadPostsSimple();
  } else {
    posts=r.data||[];
    if(!posts.length){
      var alt=await loadPostsSimple();
      if(alt.length){posts=alt;loadErr="Busca completa veio vazia; usando busca simples."}
    }
  }

  var ontem = new Date(Date.now() - 24*60*60*1000).toISOString();
  var st=await sb.from("stories").select("id,media_url,media_type,created_at,user_id,profiles(name,avatar)").gt("created_at", ontem).order("created_at",{ascending:false});
  if(st.error){loadErr+=" | Status: "+st.error.message;stories=[];}
  else stories=st.data||[];

  var fl=await sb.from("follows").select("following_id").eq("follower_id",me.id);
  if(fl.error){loadErr+=" | Seguir: "+fl.error.message;following=[];}
  else following=(fl.data||[]).map(function(f){return f.following_id});
}

async function loadPostsSimple(){
  var r=await sb.from("posts").select("*").order("created_at",{ascending:false}).limit(60);
  if(r.error){loadErr+=" | Posts simples: "+r.error.message;return[]}
  var list=r.data||[];
  if(!list.length)return list;
  var ids=list.map(function(p){return p.id});
  var uids=[];list.forEach(function(p){if(uids.indexOf(p.user_id)<0)uids.push(p.user_id)});
  var pr=await sb.from("profiles").select("id,name,avatar").in("id",uids);
  var lk=await sb.from("likes").select("post_id,user_id").in("post_id",ids);
  var cm=await sb.from("comments").select("id,post_id,body,user_id").in("post_id",ids);
  var pm={};(pr.data||[]).forEach(function(p){pm[p.id]=p});
  list.forEach(function(p){
    p.profiles=pm[p.user_id]||{name:"?",avatar:null};
    p.likes=(lk.data||[]).filter(function(l){return l.post_id===p.id});
    p.comments=(cm.data||[]).filter(function(c){return c.post_id===p.id}).map(function(c){return{id:c.id,body:c.body,profiles:pm[c.user_id]||{name:"?"}}});
  });
  return list;
}

function render(){
  var nav=document.querySelector("nav");nav.style.display=me?"":"none";
  if(!me)return authView();
  nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.v===view)});
  if(view==="feed")return feedView();
  if(view==="new")return formView();
  profView();
}

function authView(){
  $.innerHTML='<div class="tabs"><button data-m="in" class="'+(mode==="in"?"on":"")+'">Entrar</button><button data-m="up" class="'+(mode==="up"?"on":"")+'">Criar conta</button></div>'+
  '<div class="form">'+(mode==="up"?'<input id="nm" type="text" placeholder="Seu nome" autocomplete="name">':'')+
  '<input id="em" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="'+(mode==="in"?"current-password":"new-password")+'">'+
  (msg?'<p class="msg'+(ok?' ok':'')+'">'+esc(msg)+'</p>':'')+
  '<button class="btn" id="go">'+(mode==="in"?"Entrar":"Criar conta")+'</button></div>';
}

function storiesHtml(){
  var mine=-1;
  stories.forEach(function(st,idx){if(mine<0&&st.user_id===me.id)mine=idx});
  var html = '<div class="stories">';
  html += '<div class="story-item" onclick="'+(mine>=0?'openStory('+mine+')':'document.getElementById(\'story-file\').click()')+'">'+
          '<div class="story-ring'+(mine>=0?'':' add')+'">'+av(P.name, P.avatar)+'</div>'+
          '<span class="story-plus" onclick="event.stopPropagation();document.getElementById(\'story-file\').click()">+</span>'+
          '<span>Seu status</span></div>';

  stories.forEach(function(st, idx){
    if(st.user_id===me.id) return;
    var u = st.profiles || {name:"?"};
    html += '<div class="story-item" onclick="openStory('+idx+')">'+
            '<div class="story-ring">'+av(u.name, u.avatar)+'</div><span>'+esc(u.name.split(" ")[0])+'</span></div>';
  });
  html += '</div>';
  return html;
}

function openStory(idx){
  var st = stories[idx];
  if(!st) return;
  var u = st.profiles || {name:"?"};
  var mediaTag = st.media_type === 'video'
    ? '<video src="'+esc(st.media_url)+'" autoplay controls playsinline></video>'
    : '<img src="'+esc(st.media_url)+'">';
  var del = st.user_id===me.id ? '<button class="story-del" onclick="deleteStory('+st.id+')">Apagar</button>' : '';
  document.getElementById("story-overlay").innerHTML =
    '<div class="story-modal">'+
      '<div class="story-top"><b>'+esc(u.name)+' • '+ago(st.created_at)+'</b><div style="display:flex;gap:12px;align-items:center">'+del+'<button onclick="closeStory()" style="font-size:28px;color:#fff">✕</button></div></div>'+
      mediaTag+
    '</div>';
}
function closeStory(){ document.getElementById("story-overlay").innerHTML = ""; }
async function deleteStory(id){
  if(!confirm("Apagar este status?")) return;
  var r=await sb.from("stories").delete().eq("id",id);
  if(r.error){alert("Erro ao apagar: "+r.error.message);return}
  closeStory(); await load(); feedView();
}

function postHtml(p){
  var orig = p.repost_of ? posts.find(function(x){return x.id === p.repost_of}) : null;
  var target = orig || p;
  var a = target.profiles || {name:"?"};
  var repUser = p.repost_of ? (p.profiles || {name:"?"}) : null;
  
  var lk = target.likes || [], liked = lk.some(function(l){return l.user_id===me.id}), cs = target.comments || [];
  var isFollowing = following.includes(target.user_id);
  
  var mediaHtml = "";
  if(target.image){
    mediaHtml = target.media_type === 'video'
      ? '<video class="post-media" src="'+esc(target.image)+'" controls playsinline preload="metadata"></video>'
      : '<img class="post-media" src="'+esc(target.image)+'" loading="lazy">';
  }

  return '<article class="post" data-id="'+target.id+'" data-real-id="'+p.id+'">'+
    (repUser ? '<div class="repost-tag">🔁 Repostado por '+esc(repUser.name)+'</div>' : '')+
    '<div class="who">'+av(a.name,a.avatar)+
      '<div class="grow"><b>'+esc(a.name)+'</b><small>'+ago(target.created_at)+'</small></div>'+
      (target.user_id !== me.id ? '<button class="follow-btn '+(isFollowing?'following':'')+'" data-a="follow" data-uid="'+target.user_id+'">'+(isFollowing?'Seguindo':'Seguir')+'</button>' : '')+
      (p.user_id===me.id ? '<button class="mute" data-a="del" style="margin-left:8px">Apagar</button>' : '')+
    '</div>'+
    (!target.image && target.caption ? '<div class="text-only">'+esc(target.caption)+'</div>' : mediaHtml)+
    '<div class="acts">'+
      '<button class="ic'+(liked?' on':'')+'" data-a="like">'+(liked?'♥':'♡')+'<span>'+lk.length+'</span></button>'+
      '<button class="ic" data-a="repost" title="Repostar">🔁</button>'+
    '</div>'+
    (target.image && target.caption ? '<p class="p"><b>'+esc(a.name)+'</b> '+esc(target.caption)+'</p>' : '')+
    cs.map(function(c){return '<p class="p"><b>'+esc(c.profiles?c.profiles.name:"")+'</b> '+esc(c.body)+'</p>'}).join("")+
    '<div class="cm"><input type="text" placeholder="Adicione um comentário..."><button data-a="cm">Enviar</button></div>'+
  '</article>';
}

function feedView(){
  var html = storiesHtml();
  if(loadErr) html += '<p class="msg" style="padding:12px 16px">'+esc(loadErr)+'</p>';
  if(!posts.length){
    html += '<div class="empty"><p>Nada por aqui ainda.</p><button class="btn" data-go="new">Fazer primeira publicação</button></div>';
  } else {
    html += posts.map(postHtml).join("");
  }
  html += '<p class="mute" style="text-align:center;font-size:12px;padding:16px">v3 · posts: '+posts.length+' · status: '+stories.length+'</p>';
  $.innerHTML = html;
}

function formView(){
  var prevHtml = 'Toque para escolher foto ou vídeo (opcional)';
  if(mediaUrl){
    prevHtml = mediaType === 'video' 
      ? '<video class="prev" src="'+mediaUrl+'" controls></video>'
      : '<img class="prev" src="'+mediaUrl+'">';
  }
  $.innerHTML='<div class="form">'+
    '<label class="drop'+(mediaUrl?' has':'')+'">'+prevHtml+'<input id="file" type="file" accept="image/*,video/*" hidden></label>'+
    '<textarea id="cap" rows="4" placeholder="O que está acontecendo? (Escreva um texto ou legenda...)"></textarea>'+
    (msg?'<p class="msg">'+esc(msg)+'</p>':'')+
    '<button class="btn" id="pub">Publicar agora</button></div>';
}

function profView(){
  var mine=posts.filter(function(p){return p.user_id===me.id && !p.repost_of});
  $.innerHTML='<div class="prof">'+av(P.name,P.avatar)+'<div><b>'+esc(P.name)+'</b><div class="mute">'+esc(P.bio||"Sem bio ainda")+'</div></div></div>'+
  '<div class="stats"><span><b>'+mine.length+'</b> posts</span><span><b>'+following.length+'</b> seguindo</span></div>'+
  '<div class="form" style="padding-top:0"><button class="btn" id="pic">Alterar foto de perfil</button><input id="pfile" type="file" accept="image/*" hidden><button class="btn alt" id="edit">Editar nome e bio</button><button class="btn alt" id="out">Sair da conta</button></div>'+
  (mine.length?'<div class="grid">'+mine.map(function(p){
    if(!p.image) return '<div style="background:var(--surface);padding:8px;font-size:12px;aspect-ratio:1;overflow:hidden">'+esc(p.caption)+'</div>';
    return p.media_type==='video' ? '<video src="'+esc(p.image)+'"></video>' : '<img src="'+esc(p.image)+'">';
  }).join("")+'</div>':'<div class="empty">Suas publicações aparecerão aqui.</div>');
}

function shrinkImage(file, cb){
  var r = new FileReader();
  r.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      var max = 1080;
      var w = img.width, h = img.height;
      if(w > h){ if(w > max){ h *= max/w; w = max; } }
      else { if(h > max){ w *= max/h; h = max; } }
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob){ cb(blob); }, "image/jpeg", 0.82);
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
}

async function uploadMedia(fileOrBlob, folder, type){
  var ext = type === 'video' ? 'mp4' : 'jpg';
  var path = folder + "/" + me.id + "/" + Date.now() + "." + ext;
  var r = await sb.storage.from("fotos").upload(path, fileOrBlob);
  if(r.error) throw r.error;
  return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
}

document.querySelector("nav").addEventListener("click",function(e){var b=e.target.closest("button");if(b){view=b.dataset.v;msg="";render();window.scrollTo(0,0)}});

$.addEventListener("click",async function(e){
  var t=e.target;
  var m=t.closest("[data-m]");if(m){mode=m.dataset.m;msg="";authView();return}
  var g=t.closest("[data-go]");if(g){view=g.dataset.go;render();return}
  if(t.id==="go"){
    var em=val("em"),pw=val("pw");
    if(!em||!pw){msg="Preencha e-mail e senha.";ok=false;return authView()}
    if(mode==="in"){
      var r=await sb.auth.signInWithPassword({email:em,password:pw});
      if(r.error){msg=tr(r.error.message);ok=false;authView()}
    } else {
      var nm=val("nm");if(!nm){msg="Digite seu nome.";ok=false;return authView()}
      var r2=await sb.auth.signUp({email:em,password:pw,options:{data:{name:nm}}});
      if(r2.error){msg=tr(r2.error.message);ok=false;authView()}
      else if(!r2.data.session){msg="Conta criada! Confirme pelo e-mail que enviamos e depois entre.";ok=true;mode="in";authView()}
    }
    return;
  }

  var a=t.closest("[data-a]");
  if(a){
    var art=a.closest(".post"), id=Number(art.dataset.id), realId=Number(art.dataset.realId), act=a.dataset.a;
    if(act==="follow"){
      var uid=a.dataset.uid, isF=following.includes(uid);
      if(isF){
        following=following.filter(function(x){return x!==uid}); feedView();
        await sb.from("follows").delete().eq("follower_id",me.id).eq("following_id",uid);
      } else {
        following.push(uid); feedView();
        await sb.from("follows").insert({follower_id:me.id, following_id:uid});
      }
    }
    if(act==="like"){
      var p=posts.find(function(x){return x.id===id});
      var has=p.likes.some(function(l){return l.user_id===me.id});
      p.likes=has?p.likes.filter(function(l){return l.user_id!==me.id}):p.likes.concat([{user_id:me.id}]);
      feedView();
      if(has) await sb.from("likes").delete().eq("post_id",id).eq("user_id",me.id);
      else await sb.from("likes").insert({post_id:id,user_id:me.id});
    }
    if(act==="repost"){
      if(!confirm("Repostar esta publicação no seu perfil?")) return;
      await sb.from("posts").insert({user_id:me.id, repost_of:id});
      await load(); feedView();
    }
    if(act==="cm"){
      var i=art.querySelector("input"),v=i.value.trim();if(!v)return;
      await sb.from("comments").insert({post_id:id,user_id:me.id,body:v});
      await load(); feedView();
    }
    if(act==="del"){
      if(!confirm("Apagar publicação?"))return;
      await sb.from("posts").delete().eq("id",realId);
      await load(); feedView();
    }
    return;
  }

  if(t.id==="pub"){
    var cap=val("cap");
    if(!mediaBlob && !cap){msg="Escreva algo ou escolha uma foto/vídeo.";return formView()}
    if(busy)return; busy=true; t.disabled=true; t.textContent="Publicando…";
    try{
      var url = mediaBlob ? await uploadMedia(mediaBlob, "posts", mediaType) : null;
      var r = await sb.from("posts").insert({user_id:me.id, image:url, media_type:mediaType, caption:cap});
      if(r.error) throw r.error;
      mediaBlob=null; mediaUrl=null; msg=""; await load(); view="feed"; render();
    }catch(err){
      msg="Erro ao salvar: " + (err.message || "Tente novamente.");
      formView();
    }
    busy=false; return;
  }
  if(t.id==="pic"){document.getElementById("pfile").click();return}
  if(t.id==="edit"){
    var nm=prompt("Seu nome:",P.name);if(nm&&nm.trim())P.name=nm.trim();
    var bi=prompt("Sua bio:",P.bio||"");if(bi!==null)P.bio=bi.trim();
    await sb.from("profiles").update({name:P.name,bio:P.bio}).eq("id",me.id);await load();profView();return;
  }
  if(t.id==="out"){await sb.auth.signOut();return}
});

$.addEventListener("change",async function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  if(e.target.id==="file"){
    mediaType = f.type.startsWith("video/") ? "video" : "image";
    mediaUrl = URL.createObjectURL(f);
    if(mediaType === "video"){
      mediaBlob = f;
      var c=val("cap"); formView(); document.getElementById("cap").value=c;
    } else {
      shrinkImage(f, function(compressedBlob){
        mediaBlob = compressedBlob;
        var c=val("cap"); formView(); document.getElementById("cap").value=c;
      });
    }
  }
  if(e.target.id==="pfile"){
    shrinkImage(f, async function(compressedBlob){
      try{
        P.avatar = await uploadMedia(compressedBlob, "avatars", "image");
        await sb.from("profiles").update({avatar:P.avatar}).eq("id",me.id);
        await load(); profView();
      }catch(err){alert("Erro ao enviar foto.")}
    });
  }
});

$.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(e.target.matches(".cm input"))e.target.nextElementSibling.click();
});

document.getElementById("story-file").addEventListener("change", async function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  try{
    var type = f.type.startsWith("video/") ? "video" : "image";
    if(type === "video"){
      var url = await uploadMedia(f, "stories", "video");
      await sb.from("stories").insert({user_id:me.id, media_url:url, media_type:"video"});
      await load(); feedView();
    } else {
      shrinkImage(f, async function(blob){
        var url = await uploadMedia(blob, "stories", "image");
        await sb.from("stories").insert({user_id:me.id, media_url:url, media_type:"image"});
        await load(); feedView();
      });
    }
  }catch(err){alert("Erro ao publicar status.")}
});

sb.auth.onAuthStateChange(function(_e,s){var id=s?s.user.id:null;if(id!==(me?me.id:null))setTimeout(function(){setSession(s)},0)});
sb.auth.getSession().then(function(r){if(!r.data.session)render()});
</script>
</body>
</html>
